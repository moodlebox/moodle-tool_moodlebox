name: tool_moodlebox
summary: A Moodle administration plugin providing a GUI to some settings and management of a MoodleBox (https://moodlebox.net/), a Moodle server installed on a Raspberry Pi.
description: |
  This plugin enables a Moodle administrator/manager to monitor some hardware data and to configure various [MoodleBox](https://moodlebox.net/) settings directly from within Moodle.

  Examples of the configurable settings include device passwords, Wi-Fi hotspot configuration and date/time of the MoodleBox. The plugin allows also to restart or shutdown the [MoodleBox](https://moodlebox.net/).

  After its installation in Moodle, some steps are required on the Raspberry Pi to complete the installation of the plugin (see README file).

  ### Requirements:

  - A Raspberry Pi, model 3B, 3B+, 4B or 5 recommended
  - Raspberry Pi OS installed
  - Package `direvent` installed
